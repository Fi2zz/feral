name: Feral

# 本机专属配置（签名团队等），不进仓库；缺失时 Makefile 的 generate 会先生成模板。
include:
  - path: project.local.yml

options:
  bundleIdPrefix: com.fi2zz
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # SwiftData 的地板是 iOS 17，比 Swiftus 自己声明的 16 高。
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

packages:
  Swiftus:
    # https 被墙时走 SSH：SPM 底层是 git，靠全局 `insteadOf` 把 https 重写成 ssh。
    url: ssh://git@github.com/Fi2zz/swiftus.git
    exactVersion: "0.1.7"

targets:
  Feral:
    type: application
    platform: iOS
    sources:
      - path: Feral
    dependencies:
      # 只取按需产品，跳过伞产品 Swiftus（它会把 Yams/CYaml 和 SwiftusTasks.Task 一起带进来）。
      - package: Swiftus
        product: SwiftusCore
      - package: Swiftus
        product: SwiftusFoundation
      - package: Swiftus
        product: SwiftusCredentials
      - package: Swiftus
        product: SwiftusLLM
      - package: Swiftus
        product: SwiftusSearch
    info:
      path: Feral/Resources/Info.plist
      properties:
        CFBundleDisplayName: Feral
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # 真机联调要打 http://<Mac 局域网地址>:8099，ATS 默认拦明文 HTTP。
        # 这条只放开本地网络（私有网段与 .local），公网请求仍然强制 HTTPS。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fi2zz.feral
        PRODUCT_NAME: Feral
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  FeralTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeralTests
    dependencies:
      - target: Feral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fi2zz.feral.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Feral:
    build:
      targets:
        Feral: all
        FeralTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FeralTests
